name: Build Sentra Vision APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable

      - name: Complete Android structure
        working-directory: frontend
        run: |
          flutter create . --platforms=android
          flutter pub get

      - name: Build APK
        working-directory: frontend
        run: flutter build apk --release

      - name: Find APK
        working-directory: frontend
        run: |
          echo "Buscando APK..."
          find build -name '*.apk' -type f 2>/dev/null || echo 'No se encontraron APKs'
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo 'flutter-apk no existe'
          ls -la build/app/outputs/apk/release/ 2>/dev/null || echo 'apk/release no existe'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sentra-vision-apk
          path: |
            frontend/build/app/outputs/flutter-apk/*.apk
            frontend/build/app/outputs/apk/release/*.apk
          if-no-files-found: warn
