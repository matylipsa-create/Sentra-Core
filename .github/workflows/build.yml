name: Build Sentra Vision APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable

      - name: Complete Android structure
        working-directory: frontend
        run: |
          rm -rf android build .dart_tool
          flutter clean
          flutter create . --platforms=android
          flutter pub get

      - name: Build APK
        working-directory: frontend
        run: flutter build apk --release

      - name: Verify APK exists
        run: |
          echo "Buscando APK desde la raíz del repo:"
          find frontend/build -name '*.apk' -type f
          ls -la frontend/build/app/outputs/flutter-apk/ 2>/dev/null || echo "flutter-apk no existe"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sentra-vision-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
